<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="icon" href="/brand/favicon.ico">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --surface: #fcfcfb; --border: #e3e2dd;
  --text: #0b0b0b; --text-2: #52514e; --s1: #2a78d6; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2b;
    --text: #fff; --text-2: #c3c2b7; --s1: #3987e5; --crit: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2b;
  --text: #fff; --text-2: #c3c2b7; --s1: #3987e5; --crit: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
       background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border);
       border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--text-2); font-size: 13px; margin-top: -8px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
input { font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--bg); color: var(--text); }
input:focus { outline: 2px solid var(--s1); outline-offset: 1px; }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
         background: var(--s1); color: #fff; cursor: pointer; }
.err { color: var(--crit); font-size: 13px; }
.err[hidden] { display: none; }
.logo-wrap { margin: -24px -24px 0; padding: 20px 24px; border-radius: 11px 11px 0 0; }
.logo-wrap[hidden] { display: none; }
.logo-wrap img { height: 40px; width: auto; display: block; }
</style>
<link rel="stylesheet" href="/brand/brand.css">
</head>
<body>
<form method="post" action="/login">
  <div class="logo-wrap" id="logoWrap" hidden><img id="logo" alt=""></div>
  <h1 id="site">Network dashboard</h1>
  <div class="sub">Sign in to continue</div>
  <div class="err" id="err" hidden></div>
  <label>User name<input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
<script>
const e = new URLSearchParams(location.search).get("e");
if (e) {
  const box = document.getElementById("err");
  box.textContent = e === "locked" ? "Too many failed attempts. Wait 15 minutes and try again."
                                   : "That user name and password didn't match.";
  box.hidden = false;
}
fetch("/api/site").then(r => r.json()).then(s => {
  document.getElementById("site").textContent = s.site;
  document.title = `Sign in · ${s.site}`;
  if (s.logo) { document.getElementById("logo").src = s.logo; document.getElementById("logoWrap").hidden = false; }
}).catch(() => {});
</script>
</body>
</html>
